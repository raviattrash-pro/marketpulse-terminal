<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#pwaGrad)"/>
  <!-- Inner Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="white" stroke-opacity="0.15" stroke-width="4"/>
  <!-- Pulse / Financial Waveform -->
  <path d="M 80 256 L 160 256 L 208 140 L 260 372 L 312 210 L 352 280 L 390 256 L 432 256" 
        stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bullish Sparkle / Star at peak -->
  <circle cx="208" cy="140" r="14" fill="#34D399" />
  <circle cx="260" cy="372" r="10" fill="#F43F5E" />
</svg>
